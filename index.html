<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="#" href="#" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication | Socialsphere</title>
    <link rel="stylesheet" href="/css/input.css" />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
  </head>
  <body
    class="bg-gradient-to-r from-[#DC359D] via-[#C87A6A] to-[#cea210] text-white font-semibold px-4 py-2"
  >
    <header
      class="p-4 bg-gradient-to-r from-[#DC359D] via-[#C87A6A] to-[#cea210] text-white font-semibold"
    >
      <div class="flex justify-between items-center">
        <a href="/index.html" class="text-3xl font-poppins p-4">socialsphere</a>
      </div>
    </header>

    <main>
      <div class="flex items-top justify-center p-8 min-h-screen">
        <div class="w-full max-w-md bg-white shadow-lg p-8 rounded-lg">
          <h1 class="text-3xl font-bold text-center text-gray-800">Log In</h1>
          <form action="/profile/index.html" method="POST" class="mt-4 py-4">
            <label for="email" class="text-gray-800 font-inter">Email</label>
            <input
              class="w-full mt-1 p-3 rounded-lg bg-[#ececec]"
              type="email"
              id="email"
              name="email"
              placeholder="Enter email"
              required
            />
            <label for="password" class="text-gray-800 font-inter"
              >Password</label
            >
            <input
              class="w-full mt-1 p-3 rounded-lg bg-[#ececec]"
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="password"
              minlength="8"
              required
            />
            <button
              class="btn w-full px-4 py-2 mt-4 bg-gradient-to-r from-[#DC359D] via-[#C87A6A] to-[#DBBA4B] rounded-lg text-white font-semibold"
              type="submit"
            >
              Login
            </button>
          </form>

          <p class="text-center mt-8 text-gray-600">
            Don't have an account?
            <a href="/register/index.html" class="font-bold text-gray-800"
              >Sign up here</a
            >
          </p>
        </div>
      </div>
    </main>
    <footer>
      <div class="container mx-auto px-4">
        <p class="text-center mt-4">
          &copy; 2023 Socialsphere. All rights reserved.
        </p>
      </div>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
